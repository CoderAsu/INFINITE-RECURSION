<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resizeBy() and resizeTo()</title>
</head>
<body>
    <button onclick="openWindow()">Open Window</button>
    <button onclick="resizeWindow1()">Move Window1</button>
    <button onclick="resizeWindow2()">Move Window2</button>
</body>
<script>
    let myWindow;

    function openWindow(){
        myWindow = window.open("","_blank","width = 500px, height = 200px, top = 100px, left = 100px" )
        myWindow.document.write("<p>This is my window </p>")
    }

    function resizeWindow1(){
        myWindow.resizeTo(200, 200);
    }

    function resizeWindow2(){
        myWindow.resizeBy(200, 200);
    }


    // moveTo() resizes the window to the specified width and height

    // moveBy() resizes the window by the specified pixels
</script>
</html>
