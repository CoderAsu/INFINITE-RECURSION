<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moveBy() and moveTo()</title>
</head>
<body>
    <button onclick="openWindow()">Open Window</button>
    <button onclick="moveWindow1()">Move Window1</button>
    <button onclick="moveWindow2()">Move Window2</button>
</body>
<script>
    let myWindow;

    function openWindow(){
        myWindow = window.open("","_blank","width = 500px, height = 200px, top = 100px, left = 100px" )
    }

    function moveWindow1(){
        myWindow.moveTo(200, 200);
    }

    function moveWindow2(){
        myWindow.moveBy(200, 200);
    }


    // moveTo() moves a window to the specified position.

    // moveBy() moves a window relative to its current position.
</script>
</html>
