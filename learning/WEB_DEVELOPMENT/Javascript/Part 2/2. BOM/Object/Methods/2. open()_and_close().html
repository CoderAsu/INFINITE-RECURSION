<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>open() and close()</title>
</head>
<body>
    <button onclick="openWin()">Open Window</button>
    <button onclick="closeWin()">Close Window</button>
</body>
<script>

    let myWin;

    function openWin(){
        myWin = window.open("", "_blank", "width = 600px, height = 400px, left = 100px, top = 200px");
    }

    function closeWin(){
        myWin.close();
    }

    // some browser use restriction for security purposes so sometimes the window.close() doesn't work

</script>
</html>
