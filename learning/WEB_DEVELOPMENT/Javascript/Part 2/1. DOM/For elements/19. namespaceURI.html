<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">
        <div class="child" contenteditable="false"></div>
    </div>
</body>
<script>
    let parent = document.querySelector(".parent");
    let child = document.querySelector(".child");

    console.log(child.namespaceURI);
    console.log(parent.namespaceURI);
    console.log(document.body.namespaceURI);


    let answer = child.isDefaultNamespace("http://www.w3.org/1999/xhtml");
    console.log(answer);


    /* 
    
    The default namespace URI is the same for HTML and XHTML documents.

    All HTML elements inherit the namespace URI of their parents:

    http://www.w3.org/1999/xhtml 


    The namespaceURI property has no practical use in HTML.
    
    */
    
</script>
</html>
