<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accessKey</title>
</head>
<body>
    <a id="myAnchor" href="https://www.google.com/">Google</a>
</body>
<script>
    document.getElementById("myAnchor").accessKey = "g";

    console.log(document.getElementById("myAnchor").accessKey);


    /* 
        The accessKey property sets or returns the accesskey attribute of an element.

        The accessKey property specifies a shortcut key to activate or focus an element.

        Most browsers will use accesskeys only if pressed together with the Alt key.
    */

</script>
</html>
